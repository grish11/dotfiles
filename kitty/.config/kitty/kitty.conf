# Font
font_family      Comic Code 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 22.0

# Fallback for braille unicode block (U+2800-U+28FF)
symbol_map U+2800-U+28FF Symbola

# Theme
include vague.conf

# Transparency
background_opacity 0.6
background_blur 60

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Keybinds
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0

# hide that stupid titlebar
hide_window_decorations titlebar-only

# Dont get the warning when closing a window
confirm_os_window_close 0

# background color
# background #161616
