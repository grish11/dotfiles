# Font
font_family Comic Code
bold_font Comic Code Bold
italic_font Comic Code Italic
bold_italic_font Comic Code Bold Italic
font_size 22.0

# Fallback for braille unicode block (U+2800-U+28FF)
symbol_map U+2800-U+28FF Symbola# Theme
include vague.conf

# Transparency
background_opacity 0.6
background_blur 60

# Cursor 
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Keybinds
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0

# hide that stupid titlebar
hide_window_decorations titlebar-only

# background color
# background #161616
